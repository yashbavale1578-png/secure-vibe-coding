name: Skill quality checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Validate skill structure
        run: node scripts/check-skill.mjs .
      - name: Check local Markdown links
        run: node scripts/check-markdown-links.mjs .
      - name: Run local repository audit
        run: node scripts/audit-repo.mjs . --format markdown --out audit.md
      - name: Upload heuristic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heuristic-audit
          path: audit.md
          if-no-files-found: ignore
